# All defaults (IMPLEMENTATION_PLAN.md section 16). A run file in configs/runs/ overrides keys,
# and `--set a.b=value` overrides single keys on the command line.
# Units are SI (m, s, N, rad) unless a key says otherwise (_deg).
run_name: A_exact_sdp_k1
seed: 0
task: T3_translate_rotate

# Tasks (plan 4.7): slider pose (x, y, theta) at the start and at the goal.
tasks:
  T1_push_straight:    {start: [0.0, 0.0, 0.0], goal: [0.30, 0.0, 0.0]}
  T2_rotate_90:        {start: [0.0, 0.0, 0.0], goal: [0.0, 0.0, 1.5707963267948966]}
  T3_translate_rotate: {start: [0.0, 0.0, 0.0], goal: [0.20, 0.15, 1.5707963267948966]}
  T4_rotate_180:       {start: [0.0, 0.0, 0.0], goal: [0.10, 0.0, 3.141592653589793]}
# The pusher starts in the strip behind face 2 (-x). Its position is in the slider body frame.
task_common:
  pusher_start: [-0.125, 0.0]
  start_region: strip_2

model:
  gravity: 9.81
  slider: {half_x: 0.10, half_y: 0.075, mass: 0.1, mu_table: 0.5}
  pusher: {radius: 0.01, mu_contact: 0.5, v_max_step: 0.02}
  limit_surface: {c_v: 0.5, rbar_grid: 1000}   # c_v sets the speed scale; rbar on an n x n grid
  workspace: {p_box: [[-0.6, 0.6], [-0.6, 0.6]], r_ws: 0.4}
  force: {fn_max: 0.5}
  step: {theta_step_max_deg: 15}

trellis:
  N: 32
  dt: 0.1
  contact_types: [stick, slide_pos, slide_neg]
  noncontact_regions: 8
  faces: [0, 1, 2, 3]            # subsets give the reduced instances (plan 12.3)
  regions: all                   # all, or a list of strip_j / corner_j names

costs: {w_p: 1.0, w_theta: 0.5, w_r: 1.0, w_f: 0.01, w_switch: 0.05}

relaxation:
  type: sdp                      # sdp | taylor
  order: 1                       # kappa
  couple_second_moments: true
  rlt: false
  ball: true                     # redundant ball row of tex 3.3 at kappa >= 2 (the interval rows imply it at kappa 1)
  eliminate_linear: true         # substitute linear equalities before lifting (5.1.7): the same set, far smaller; false keeps the full form
  regions: {theta_splits: 1, lambda_splits: 1}
  taylor_mode: band              # band | mccormick   (B only)
  cost_model: tangent_planes     # tangent_planes | soc (B only)
  cost_planes: 16
  size_regions: {trans: 1.0e-3, torque: 1.0e-4, max_splits: 4096}   # offline sizing targets in m and N m (5.3)
  # True samples per edge type that must satisfy every row and PSD block (5.4); fewer at kappa 3,
  # where a moment vector has 54,264 entries. PSD blocks are checked on all samples through their
  # rank-one identity, and by a direct eigenvalue on a subset when they are larger than 32 x 32.
  validity: {samples: 10000, samples_k3: 200, tol_rows: 1.0e-9, tol_psd: 1.0e-10, eig_samples: 16, eig_samples_large: 2, seed: 0}

solver:
  rounds_max: 50000              # safety stop only
  time_budget_s: 1800            # safety stop only
  stall_rounds: 2000             # safety stop: no L_best / U_flow progress > 1e-6 rel
  rounds_per_scan: 50
  theta_pd: auto                 # per-config tuning (7.3): runs/tuned/<config>_<task>.yaml
  theta_psd: same                # same | <float>
  primal_weight_update: none     # none | pdlp
  tune: {grid: [0.003, 0.01, 0.03, 0.1, 0.3, 1.0], rounds: 2000, score: kkt}
  delta: 1.0e-4                  # state tolerance of P_delta
  stop: {eta_rel: 1.0e-3, eps_flow: 1.0e-6, eps_psd: 1.0e-8, eps_row: 1.0e-8}   # 10.5
  compile: {aot: true, cache_dir: ~/.cache/trellis_jax, fail_on_late_compile: true}
  dtype: float64
  qp_block: auto                 # exact_ipm for kappa=1, split_rows for kappa>=2
  psd_proj: auto                 # auto | eigh | lowrank | polar_ns: eigh at kappa 1, lowrank (polar_ns fallback) above (8.2)
  psd_lowrank: {p: 8, tol: 1.0e-6, exact_check_every: 50}   # basis size, residual that sends a matrix to the fallback, rounds between exact-error logs (kappa 1)
  # Edge QP (8.1). iters caps the iterations. adaptive stops once every edge has converged, at the
  # cost of reading one flag per iteration. cholesky: library | small (hand-written, for small sizes).
  ipm: {iters: 40, tol: 1.0e-11, adaptive: true, cholesky: library}
  log_every_s: 10                # progress line at most this often; every scan block goes to log.jsonl
  restarts: {scheme: pdlp_kkt, beta_sufficient: 0.2, beta_necessary: 0.8}
  checkpoint_every: 2000

skipping:
  zero_test: true
  lb_tol: 1.0e-12
  face_cache: false              # true for B
  gershgorin_skip: true
  compaction: bucketed           # none | bucketed  (15.5: measure both)

tree:
  type: exact                    # none | exact | lowrank_a | lowrank_b
  every: 10
  reg: 1.0e-8
  rank: 16
  jacobian: one_step             # one_step | frozen_rank (11.1)
  eig_tol: 1.0e-8                # frozen_rank only
  primal_predict: false          # exact / C-a only
  lowrank_a: {oversample: 8}
  reference: {model: pos_vel, channels_per_coord: 2, gamma_v: 1.0, w_c: 1.0, w_a: 1.0}   # C-b, 12.2
  secant_history: auto           # max(8, rank)
  secant_sources: [trials, probes]   # add 'rounds' to also use ordinary-round differences
  probe_solves_per_refresh: 0
  probe_scale: 1.0e-2
  safeguard:
    type: supermann              # supermann | hpe
    c0: 0.0                      # 0 disables blind K0 steps (12.4: check the actual update)
    c1: 0.99
    q: 0.99
    sigma: 0.1
    relax: 1.0
    beta: 0.5
    max_trials: 3
    hpe: {sigma: 0.9, lambda_min: 0.1}

certificate:
  free_every: 1                  # rounds
  exact_every: 200
  full_exact_every: 1000
  lazy: true
  bnb: {enabled: true, every: 500, max_splits: 8}
  eps_cert: 1.0e-12
  cert_workers: 32
  reference_check_small: true

extraction:
  every: 1000
  methods: [flow_decomp, random_round, cert_kshortest, greedy]
  k_paths: 8
  samples: 256

# Video (plan 13.5): a step lasts slow * dt on screen; force_scale is metres of arrow per newton.
render: {fps: 30, slow: 3, width: 960, height: 720, elevation: -75, force_scale: 0.2, filmstrip_cols: 8}
output: {root: runs}

# Build-time CPU work (LP pruning, validity checks, reference solves) uses at most this many threads.
build: {workers: 32, timeout_s: 3600}

# CPU reference solve of the whole relaxation on small instances, for J_rel (plan 10.4, M2).
reference:
  solver: auto                   # auto | clarabel | scs. auto: clarabel if every PSD block fits clarabel_max_block, else scs
  clarabel_max_block: 32         # Clarabel forms a dense KKT block per PSD cone, so it fits small blocks only
  time_limit_s: 1800
  clarabel: {tol: 1.0e-8, max_iter: 200, direct_solve_method: faer}   # faer is multithreaded; qdldl runs on one thread whatever the budget
  scs: {eps: 1.0e-5, max_iters: 100000000}                            # first order: lower accuracy, stopped by the time limit

# Build-time pruning (plan 6.1): per-edge-type LPs over the linear rows of the true model.
pruning:
  box_margin: 1.0e-7             # relative outward pad on LP-tightened variable boxes
  infeasible_margin: 1.0e-7      # selftest: a pruned type must miss feasibility by more than this

# The tiny self-test instance (plan 12.3): N = 8, 2 faces, 4 regions.
selftest:
  N: 8
  task: T1_push_straight
  faces: [0, 2]
  regions: [strip_0, strip_2, corner_1, corner_2]
  theta_splits: 8                # the region copies M1 checks (A-reg, B)
  m2:
    tasks: [T1_push_straight, T3_translate_rotate]         # --survey: the tiny instance's tasks; selftest.task must be among them
    order2: {task: T1_push_straight, N: 4, time_limit_s: 300}   # --survey: the two forms, and SDP order 2 through SCS, on a shorter horizon
    tol_hand: 1.0e-6             # J_rel may exceed J_hand by this much
    tol_forms: 1.0e-5            # the reduced and full forms may differ by this much, relative to max(1, |J_rel|)
  m3:                            # run_trajopt.py --selftest, against the saved ref_tiny value
    eta_rel: 5.0e-6              # gap small enough to put the objective within 1e-4 of J_rel on this instance
    rounds_max: 400000
    time_budget_s: 1200
    stall_rounds: 50000
    tune_rounds: 500             # per step-size candidate
    qp_edges: 16                 # edge QPs compared against Clarabel, per draw
    bound_draws: 20              # random multiplier draws for the free bound
    tol_j_rel: 1.0e-5            # slack on J_rel, which comes from a solver stopped at reduced accuracy

# M0 benchmarks (plan 8.2 and section 0: every round primitive must truly batch).
bench:
  peak_tflops_fp64: 19.5         # A100 FP64 tensor-core peak: the FLOP roofline for the batching verdicts
  peak_bandwidth_gbs: 2039       # A100 80 GB SXM memory bandwidth: the traffic roofline for the same verdicts
  edges_per_round: 2600          # matrices per round at N = 32 (one per edge), for the per-round summary
  eigh: [[16, 2600], [16, 80000], [136, 2600], [136, 20000], [816, 64], [816, 256]]   # --bench_eigh: [size, batch]
  eigh_repeats: 5
  psd:                           # --bench_psd: exact eigh vs low-rank tracking at the order-1, -2, -3 sizes
    repeats: 5
    sizes: [[16, [650, 2600]], [136, [650, 2600]], [816, [256, 1024]]]   # [n, [batches]]
    rank: 4                      # positive eigenvalues per matrix (moment matrices approach low rank)
    gap: 0.01                    # negative eigenvalues lie in [-2, -gap], so the exact answer has exactly `rank` positives
    perturbation: 1.0e-3         # change between rounds; the warm basis comes from the matrix before it
    lowrank_p: [8, 16]           # tracked basis size, capped at n/2
    eigh_max_elements: 2.0e8     # batch * n^2 above which eigh is not timed (it runs matrix by matrix)
  linalg:                        # --bench_linalg, before M3
    repeats: 5
    # Cholesky + triangular solves: the IPM normal equations (B ~30, A 136) and the tree pivots (A 560, B 960)
    cholesky: [[30, [2600, 10400]], [136, [2600, 10400]], [560, [16, 64]], [960, [16, 64]]]
    merge_eigh: [[32, [16, 64]], [128, [16, 64]]]                  # low-rank tree merge, k = 2r for r = 16, 64
    merge_orth: [[1120, 32, [16, 64]], [1120, 128, [16, 64]]]      # [rows, cols, [batches]]: QR vs Gram-matrix orthonormalization
    coupling: {q: 28, edges: [2600, 26000]}
  small_cholesky:                # --bench_chol: the edge QP's real system sizes (8.1), library vs hand-written
    repeats: 5
    sizes: [3, 5, 7, 10, 14]
    batches: [650, 2600]
