# Run matrix (plan sections 1 and 15.2), read by launch.py. Run names refer to configs/runs/.
stage1:
  mode: timing                   # one exclusive job per GPU; all wall-clock comparisons come from this mode
  small_kappa_baselines: true    # false drops the GPU-7 baselines
  tuning:                        # short count-scored step-size tuning (7.3), throughput mode, before the solves
    mode: throughput
    configs: [A, A_lowrank, A_k2, B, C_a_r16, C_b_r16, D, A_k3_small, A_small, A_k2_small]
  jobs:
    - {gpu: 0, runs: [A, A_lowrank], task: T3_translate_rotate, sequential: true}   # exact vs low-rank projection, same GPU
    - {gpu: 1, runs: [A_k2], task: T3_translate_rotate}
    - {gpu: 2, runs: [B], task: T3_translate_rotate}
    - {gpu: 3, runs: [C_a_r16], task: T3_translate_rotate}
    - {gpu: 4, runs: [C_b_r16], task: T3_translate_rotate}
    - {gpu: 5, runs: [D], task: T3_translate_rotate}
    - {gpu: 6, runs: [A_k3_small], task: T2_rotate_90}
    - {gpu: 7, runs: [A_small, A_k2_small], task: T2_rotate_90, sequential: true, needs: small_kappa_baselines}

stage2:                          # 21 jobs in 3 waves
  mode: timing
  runs: [A, A_lowrank, A_k2, B, C_a_r16, C_b_r16, D]
  tasks: [T1_push_straight, T2_rotate_90, T4_rotate_180]

stage3: {}                       # chosen after stages 1-2: rank sweep, C_b_r16_p4, A_reg, sweep_N

sweep_N:
  enabled: false
  N: [16, 32, 64, 128]
  runs: [A, A_lowrank, C_a_r16, C_b_r16, D]
  task: T3_translate_rotate

seeds: [0]
